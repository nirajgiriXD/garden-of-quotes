<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Garden of Quotes</title>
    <meta
      name="description"
      content="A serene space where wisdom, inspiration and creativity blossom through quotes from diverse perspectives around the globe."
    />
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b21" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Garden of Quotes" />
    <meta
      property="og:description"
      content="A serene space where wisdom, inspiration and creativity blossom."
    />
    <meta name="twitter:card" content="summary" />

    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong colour scheme. Mirrors the logic in src/components/theme-provider.
      (() => {
        try {
          const stored = localStorage.getItem("garden-of-quotes.theme");
          const dark =
            stored === "dark" ||
            ((stored === "system" || stored === null) &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          /* No stored preference available — fall back to the light theme. */
        }
      })();
    </script>
    <script type="module" crossorigin src="/garden-of-quotes/assets/index-IU8E0nqD.js"></script>
    <link rel="stylesheet" crossorigin href="/garden-of-quotes/assets/index-CDVq9G7p.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
